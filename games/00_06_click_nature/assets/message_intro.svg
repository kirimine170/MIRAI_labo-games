<svg version="1.1" width="440" height="180" viewBox="0 0 440 180" xmlns="http://www.w3.org/2000/svg">
  <rect x="7" y="7" width="426" height="166" rx="20" fill="#ffffff" stroke="#0284c7" stroke-width="7"/>
  <text x="220" y="48" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#075985">大きな魚がかかった！</text>
  <text x="220" y="88" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#0c4a6e">「リールをまく！」を30回おして</text>
  <text x="220" y="124" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#0c4a6e">時間内に魚を近くまでひきよせよう！</text>
  <text x="220" y="153" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ea580c">3秒後にスタート</text>
