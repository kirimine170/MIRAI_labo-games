name: Verify repository

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked sources and project metadata
        run: ./scripts/check-repository.sh
      - name: Validate catalog manifests
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/validate_catalog.py
      - name: Run catalog unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Enforce per-game Semantic Version increases
        if: github.event_name != 'workflow_dispatch'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          base_sha="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            echo "No comparable base revision．Skipping version-delta check．"
          else
            PYTHONDONTWRITEBYTECODE=1 python3 tools/game_versions.py check "$base_sha"
          fi

  build:
    name: Compile Scratch projects
    needs: structure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned goboscript toolchain
        run: ./scripts/bootstrap-goboscript.sh
      - name: Build and inspect all projects
        run: ./scripts/build-projects.sh "$RUNNER_TEMP/sb3"
      - name: Build learner-safe defect projects
        run: |
          ./scripts/build-student-defect.sh games/00_05_click_cooking games/00_05_click_cooking/defects/00_05-D01.patch "$RUNNER_TEMP/student/00_05-D01.sb3"
          ./scripts/build-student-defect.sh games/00_06_click_nature games/00_06_click_nature/defects/D01/remove-fish-progress-update.patch "$RUNNER_TEMP/student/00_06-D01.sb3"
          ./scripts/build-student-defect.sh games/00_07_click_sports games/00_07_click_sports/defects/00_07-D01-stale-runner.patch "$RUNNER_TEMP/student/00_07-D01.sb3"
          ./scripts/build-student-defect.sh games/00_08_click_security games/00_08_click_security/defects/00_08-D01-stale-virus.patch "$RUNNER_TEMP/student/00_08-D01.sb3"
          ./scripts/build-student-defect.sh games/00_09_click_music games/00_09_click_music/defects/00_09-D01.patch "$RUNNER_TEMP/student/00_09-D01.sb3"
