name: Release Scratch projects

on:
  push:
    tags:
      - "release-v*.*.*"
      - "prerelease-v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish versioned SB3 files
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release channel and version
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^release-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^prerelease-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Validate catalog and tests
        run: |
          ./scripts/check-repository.sh
          PYTHONDONTWRITEBYTECODE=1 python3 tools/validate_catalog.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Check release readiness
        shell: bash
        run: |
          if [[ "${{ steps.release.outputs.prerelease }}" == "true" ]]; then
            PYTHONDONTWRITEBYTECODE=1 python3 tools/game_versions.py release-ready
          else
            PYTHONDONTWRITEBYTECODE=1 python3 tools/game_versions.py release-ready --stable
          fi
      - name: Install pinned goboscript toolchain
        run: ./scripts/bootstrap-goboscript.sh
      - name: Build versioned Scratch projects
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: ./scripts/build-release.sh "$RUNNER_TEMP/release"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          release_args=(
            "$GITHUB_REF_NAME"
            "$RUNNER_TEMP"/release/*
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --title "MIRAI labo games v${RELEASE_VERSION}"
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
